<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="Projects, certifications and awards.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before the page paints, so there is no flash.
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>

  <header class="top gutter">
    <a class="mark" href="#top" id="mark"></a>
    <nav aria-label="Sections">
      <a href="#work">Work</a>
      <a href="#experience">Experience</a>
      <a href="#credentials">Credentials</a>
      <a href="#about">About</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </nav>
  </header>

  <main id="top">
    <section class="hero gutter">
      <h1 id="headline"></h1>
      <div class="side">
        <p class="lead" id="intro"></p>
        <p id="sub-intro"></p>
        <div class="btns" id="hero-buttons"></div>
      </div>
    </section>

    <section class="section gutter" id="work" aria-labelledby="work-title">
      <div class="sec-title">
        <h2 id="work-title">Selected work</h2>
        <span id="work-count"></span>
      </div>
      <div class="filters" id="work-filters" role="group" aria-label="Filter projects by technology"></div>
      <div class="work" id="work-grid"></div>
    </section>

    <section class="section gutter" id="experience" aria-labelledby="exp-title">
      <div class="sec-title">
        <h2 id="exp-title">Experience</h2>
        <span id="exp-count"></span>
      </div>
      <div class="exp" id="exp-list"></div>
    </section>

    <section class="section gutter" id="credentials" aria-labelledby="cred-title">
      <div class="sec-title">
        <h2 id="cred-title">Certifications &amp; awards</h2>
        <span id="cred-count"></span>
      </div>
      <div class="shelf" id="shelf"></div>
    </section>

    <section class="section gutter" id="skills" aria-labelledby="skills-title">
      <div class="sec-title">
        <h2 id="skills-title">Education &amp; skills</h2>
      </div>
      <div class="skills-grid">
        <div class="edu" id="edu-list"></div>
        <dl class="skills" id="skills-list"></dl>
      </div>
    </section>

    <section class="section gutter about" id="about" aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <div>
        <div class="about-text" id="about-text"></div>
        <div class="contact">
          <span class="mail" id="email"></span>
          <button class="btn ghost small" type="button" id="copy-email">Copy email</button>
        </div>
        <ul class="social" id="social"></ul>
      </div>
    </section>
  </main>

  <footer class="gutter">
    <span id="footer-name"></span>
    <span id="footer-year"></span>
  </footer>

  <dialog id="detail" aria-labelledby="detail-title">
    <button class="close" type="button" id="detail-close" aria-label="Close">×</button>
    <div id="detail-body"></div>
  </dialog>

  <!-- Your content lives in js/content.js. Edit that file to add projects, certifications and awards. -->
  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
