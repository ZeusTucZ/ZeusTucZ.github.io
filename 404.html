<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Lorenzo Orrante</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    .lost { min-height: 100vh; display: grid; place-content: center; gap: 20px; padding-block: 48px; }
    .lost h1 { font-family: var(--display); font-weight: 800; font-size: clamp(56px, 12vw, 140px); line-height: .9; letter-spacing: -0.04em; margin: 0; }
    .lost h1 span { color: var(--accent); }
    .lost p { color: var(--muted); max-width: 40ch; margin: 0; }
  </style>
</head>
<body>
  <main class="lost gutter">
    <h1>404<span>.</span></h1>
    <p>This page doesn't exist. It may have moved, or the link has a typo.</p>
    <div class="btns">
      <a class="btn primary" href="/">Back to the portfolio</a>
      <a class="btn ghost" href="/#work">See projects</a>
    </div>
  </main>
</body>
</html>
